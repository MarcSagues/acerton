<div class="page">
  <div class="head-row">
    <a class="back-link" routerLink="/login">
      <piqo-svg icon="atras" size="20"></piqo-svg>
      Acceso
    </a>
  </div>

  @if (page.submitted()) {
    <div class="title-row">
      <h1>Revisa tu correo</h1>
      <p class="lead">
        Si existe una cuenta con ese correo, te hemos enviado un enlace para elegir una nueva contraseña.
      </p>
    </div>
  } @else {
    <div class="title-row">
      <h1>¿Olvidaste tu contraseña?</h1>
      <p class="lead">Te enviaremos un enlace para restablecerla.</p>
    </div>

    <form [formGroup]="page.form" (ngSubmit)="page.submit()" class="form">
      <label class="field">
        <span class="field-label">Correo</span>
        <input class="field-input" type="email" formControlName="email" autocomplete="email" placeholder="tu@correo.com" />
      </label>

      @if (page.errorMessage()) {
        <p class="error">{{ page.errorMessage() }}</p>
      }

      <button type="submit" class="piqo-primary cta" [disabled]="page.loading()">
        @if (page.loading()) {
          <app-spinner [size]="20"></app-spinner>
        } @else {
          Enviar enlace
        }
      </button>
    </form>
  }
</div>
