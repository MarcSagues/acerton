@if (page.loading()) {
  <div class="loading"><app-spinner [size]="32"></app-spinner></div>
} @else {
  <div class="page">
    @if (page.groups().length > 0) {
      <div class="title-row">
        <h1>Tus grupos</h1>
        <p class="lead">Elige dónde pronosticas esta jornada.</p>
      </div>
    }

    @if (page.groups().length === 0) {
      <app-empty-state
        icon="grupos"
        [large]="true"
        [standalone]="page.isStandaloneWelcome"
        title="Todavía no estás en ningún grupo"
        text="Crea uno para tu gente o únete con el código que te hayan pasado."
        ctaLabel="Crear grupo"
        cta2Label="Unirse con código"
        (cta)="page.goToCreate()"
        (cta2)="page.goToJoinCode()"
      ></app-empty-state>
    } @else {
      <div class="groups">
        @for (group of page.groups(); track group.id) {
          <div class="group-row" [class.active]="group.id === page.activeGroupId()">
            <button type="button" class="group-main" (click)="page.goToGroup(group.id)">
              <span class="avatar">{{ page.initials(group.name) }}</span>
              <span class="meta">
                <span class="name">{{ group.name }}</span>
                <span class="sub">{{ group._count?.memberships ?? 0 }} miembros · {{ group.isPublic ? 'público' : 'privado' }}</span>
                @if (page.streakFor(group.id); as streak) {
                  <span class="streak-chip"><piqo-svg icon="racha" size="14"></piqo-svg>{{ streak }} jornadas</span>
                }
              </span>
              @if (group.id === page.activeGroupId()) {
                <span class="active-chip"><piqo-svg icon="check" size="18"></piqo-svg>Activo</span>
              }
            </button>
            <button type="button" class="settings-btn" aria-label="Ajustes del grupo" (click)="page.goToSettings(group.id)">
              <piqo-svg icon="ajustes" size="22"></piqo-svg>
            </button>
          </div>
        }
      </div>

      <div class="actions">
        <button type="button" class="piqo-primary action-btn" (click)="page.goToCreate()">
          <piqo-svg icon="mas" size="20"></piqo-svg>Crear grupo
        </button>
        <button type="button" class="piqo-secondary action-btn" (click)="page.goToJoinCode()">
          <piqo-svg icon="enlace" size="20"></piqo-svg>Unirse con código
        </button>
      </div>
    }

    <button type="button" class="explore-public-btn" (click)="page.goToExplorePublic()">
      <span class="explore-icon"><piqo-svg icon="publico" size="20"></piqo-svg></span>
      <span class="explore-text">
        <span class="explore-title">Explorar grupos públicos</span>
        <span class="explore-sub">Busca uno por liga, modo o nombre</span>
      </span>
      <piqo-svg icon="flecha" size="18"></piqo-svg>
    </button>
  </div>
}
