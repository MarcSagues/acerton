<div class="page">
  <div class="head-row">
    <button type="button" class="back-link" (click)="page.goBack()">
      <piqo-svg icon="atras" size="20"></piqo-svg>
      Grupos
    </button>
  </div>
  <div class="hero-icon">
    <div class="hero-icon-gap">
      <div class="hero-icon-inner">
        <piqo-svg icon="invitar" size="44"></piqo-svg>
      </div>
    </div>
  </div>

  <div class="title-row">
    <h1>Unirse a un grupo</h1>
    <p class="lead">Pide el código a quien ya está dentro. Son nueve caracteres.</p>
  </div>

  <form [formGroup]="page.form" (ngSubmit)="page.joinGroup()" class="form">
    <label class="field">
      <span class="field-label">Código de invitación <span class="required">· obligatorio</span></span>
      <input class="field-input mono" formControlName="inviteCode" placeholder="PIQO-0000" maxlength="12" />
    </label>

    <button type="submit" class="piqo-primary cta">Ver grupo</button>

  </form>
</div>
