<div class="page">
  <div class="head-row">
    <button type="button" class="back-link" (click)="page.goBack()">
      <piqo-svg icon="atras" size="20"></piqo-svg>
      {{ 'common.grupos' | t }}
    </button>
  </div>
  <div class="hero-icon">
    <div class="hero-icon-gap">
      <div class="hero-icon-inner">
        <piqo-svg icon="invitar" size="44"></piqo-svg>
      </div>
    </div>
  </div>

  <div class="title-row">
    <h1>{{ 'groupJoinCode.unirseGrupo' | t }}</h1>
    <p class="lead">{{ 'groupJoinCode.pideCodigoQuienYa' | t }}</p>
  </div>

  <form [formGroup]="page.form" (ngSubmit)="page.joinGroup()" class="form">
    <label class="field">
      <span class="field-label">{{ 'groupJoinCode.codigoInvitacion' | t }} <span class="required">{{ 'common.obligatorio' | t }}</span></span>
      <input class="field-input mono" formControlName="inviteCode" [attr.placeholder]="'groupJoinCode.piqo0000' | t" maxlength="12" />
    </label>

    <button type="submit" class="piqo-primary cta">{{ 'common.verGrupo' | t }}</button>

  </form>
</div>
