<div class="page">

    <div class="hero-icon-gap">
      <div class="hero-icon-inner">
        <piqo-svg icon="error" size="44"></piqo-svg>
      </div>
    </div>
  </div>

  <div class="title-row">
    <h1>{{ 'errorPage.algoHaIdoMal' | t }}</h1>

  <div class="actions">

</div>
