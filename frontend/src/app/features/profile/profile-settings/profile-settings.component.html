<div class="page">
  <div class="head-row">
    <button type="button" class="back-btn" (click)="goBack()">
      <piqo-svg icon="atras" size="20"></piqo-svg>{{ 'common.perfil' | t }}
    </button>
  </div>
  <div class="title-row">
    <h1>{{ 'profilePage.ajustes' | t }}</h1>
  </div>

  <nav class="tabs" [attr.aria-label]="'profilePage.ajustes' | t">
    @for (tab of tabs(); track tab.path) {
      <a class="tab" [routerLink]="tab.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{ tab.label | t }}</a>
    }
  </nav>

  <router-outlet></router-outlet>
</div>
