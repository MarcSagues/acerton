<div class="level-up-dialog">
  <div class="ring">
    <span class="ring-level">{{ data.level }}</span>
  </div>
  <p class="eyebrow">NUEVO NIVEL</p>
  <p class="title">¡Subiste al nivel {{ data.level }}!</p>
  <p class="message">Tienes una recompensa nueva esperando. Puedes verla y activarla desde tu perfil.</p>
  <button type="button" class="btn primary" (click)="accept()">Aceptar</button>
</div>
