<div class="level-up-dialog">
  <div class="ring">
    <span class="ring-level">{{ data.level }}</span>
  </div>
  <p class="eyebrow">{{ 'levelUpDialog.nuevoNivel' | t }}</p>
  <p class="title">{{ 'levelUpDialog.subisteNivel' | t: { level: data.level } }}</p>
  <p class="message">{{ 'levelUpDialog.tienesRecompensaNuevaEsperando' | t }}</p>
  <button type="button" class="btn primary" (click)="accept()">{{ 'common.aceptar' | t }}</button>
</div>
