<div class="page">
  <div class="head-row">
    <button type="button" class="back-btn" [attr.aria-label]="'common.volver2' | t" (click)="page.goBack()">
      <piqo-svg icon="atras" size="20"></piqo-svg>
    </button>
    <h1>{{ 'common.eliminarCuenta' | t }}</h1>
  </div>

  <form [formGroup]="page.form" (ngSubmit)="page.submit()" class="form">
    <p class="explainer">
      {{ 'profileDeleteAccount.eliminarCuentaBorranPerfil' | t }}
    </p>

    @if (page.hasPassword()) {
      <label class="field">
        <span class="field-label">{{ 'common.contrasena' | t }}</span>
        <div class="field-input password-input">
          <input
            [type]="page.passwordVisible() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="password-toggle"
            [attr.aria-label]="page.passwordVisible() ? ('common.ocultarContrasena' | t) : ('common.mostrarContrasena' | t)"
            (click)="page.togglePasswordVisibility()"
          >
            <piqo-svg [attr.icon]="page.passwordVisible() ? 'ojo-cerrado' : 'ojo'" size="18"></piqo-svg>
          </button>
        </div>
      </label>
    }

    <label class="ack-row">
      <input type="checkbox" [checked]="page.acknowledged()" (change)="page.toggleAcknowledged()" />
      <span>{{ 'profileDeleteAccount.entiendoEstaAccionPuede' | t }}</span>
    </label>

    @if (page.errorMessage()) {
      <p class="error">{{ page.errorMessage() }}</p>
    }

    <button type="submit" class="delete-btn mono" [disabled]="page.loading()">
      @if (page.loading()) {
        <app-spinner [size]="20"></app-spinner>
      } @else {
        {{ 'profileDeleteAccount.eliminarCuenta' | t }}
      }
    </button>
  </form>
</div>
