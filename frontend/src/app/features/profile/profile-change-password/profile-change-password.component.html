<div class="page">
  <form [formGroup]="page.form" (ngSubmit)="page.submit()" class="form">
    <label class="field">
      <span class="field-label">{{ 'profileChangePassword.contrasenaActual' | t }}</span>
      <div class="field-input password-input">
        <input
          [type]="page.isPasswordVisible('currentPassword') ? 'text' : 'password'"
          formControlName="currentPassword"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="password-toggle"
          [attr.aria-label]="page.isPasswordVisible('currentPassword') ? ('common.ocultarContrasena' | t) : ('common.mostrarContrasena' | t)"
          (click)="page.togglePasswordVisibility('currentPassword')"
        >
          <piqo-svg [attr.icon]="page.isPasswordVisible('currentPassword') ? 'ojo-cerrado' : 'ojo'" size="18"></piqo-svg>
        </button>
      </div>
    </label>

    <label class="field">
      <span class="field-label">{{ 'profileChangePassword.contrasenaNueva' | t }}</span>
      <div class="field-input password-input">
        <input
          [type]="page.isPasswordVisible('newPassword') ? 'text' : 'password'"
          formControlName="newPassword"
          autocomplete="new-password"
          [attr.placeholder]="'common.minimo8Caracteres' | t"
        />
        <button
          type="button"
          class="password-toggle"
          [attr.aria-label]="page.isPasswordVisible('newPassword') ? ('common.ocultarContrasena' | t) : ('common.mostrarContrasena' | t)"
          (click)="page.togglePasswordVisibility('newPassword')"
        >
          <piqo-svg [attr.icon]="page.isPasswordVisible('newPassword') ? 'ojo-cerrado' : 'ojo'" size="18"></piqo-svg>
        </button>
      </div>
    </label>

    <label class="field">
      <span class="field-label">{{ 'profileChangePassword.repiteContrasenaNueva' | t }}</span>
      <div class="field-input password-input">
        <input
          [type]="page.isPasswordVisible('confirmPassword') ? 'text' : 'password'"
          formControlName="confirmPassword"
          autocomplete="new-password"
        />
        <button
          type="button"
          class="password-toggle"
          [attr.aria-label]="page.isPasswordVisible('confirmPassword') ? ('common.ocultarContrasena' | t) : ('common.mostrarContrasena' | t)"
          (click)="page.togglePasswordVisibility('confirmPassword')"
        >
          <piqo-svg [attr.icon]="page.isPasswordVisible('confirmPassword') ? 'ojo-cerrado' : 'ojo'" size="18"></piqo-svg>
        </button>
      </div>
    </label>

    @if (page.errorMessage()) {
      <p class="error">{{ page.errorMessage() }}</p>
    }

    <button type="submit" class="piqo-primary cta" [disabled]="page.loading()">
      @if (page.loading()) {
        <app-spinner [size]="20"></app-spinner>
      } @else {
        {{ 'common.guardar' | t }}
      }
    </button>
  </form>
</div>
