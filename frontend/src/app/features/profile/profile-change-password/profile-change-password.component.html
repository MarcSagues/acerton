<div class="page">
  <div class="head-row">
    <button type="button" class="back-btn" aria-label="Volver" (click)="page.goBack()">
      <piqo-svg icon="atras" size="20"></piqo-svg>
    </button>
    <h1>Cambiar contraseña</h1>
  </div>

  <form [formGroup]="page.form" (ngSubmit)="page.submit()" class="form">
    <label class="field">
      <span class="field-label">Contraseña actual</span>
      <div class="field-input password-input">
        <input
          [type]="page.isPasswordVisible('currentPassword') ? 'text' : 'password'"
          formControlName="currentPassword"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="password-toggle"
          [attr.aria-label]="page.isPasswordVisible('currentPassword') ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          (click)="page.togglePasswordVisibility('currentPassword')"
        >
          <piqo-svg [attr.icon]="page.isPasswordVisible('currentPassword') ? 'ojo-cerrado' : 'ojo'" size="18"></piqo-svg>
        </button>
      </div>
    </label>

    <label class="field">
      <span class="field-label">Contraseña nueva</span>
      <div class="field-input password-input">
        <input
          [type]="page.isPasswordVisible('newPassword') ? 'text' : 'password'"
          formControlName="newPassword"
          autocomplete="new-password"
          placeholder="Mínimo 8 caracteres"
        />
        <button
          type="button"
          class="password-toggle"
          [attr.aria-label]="page.isPasswordVisible('newPassword') ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          (click)="page.togglePasswordVisibility('newPassword')"
        >
          <piqo-svg [attr.icon]="page.isPasswordVisible('newPassword') ? 'ojo-cerrado' : 'ojo'" size="18"></piqo-svg>
        </button>
      </div>
    </label>

    <label class="field">
      <span class="field-label">Repite la contraseña nueva</span>
      <div class="field-input password-input">
        <input
          [type]="page.isPasswordVisible('confirmPassword') ? 'text' : 'password'"
          formControlName="confirmPassword"
          autocomplete="new-password"
        />
        <button
          type="button"
          class="password-toggle"
          [attr.aria-label]="page.isPasswordVisible('confirmPassword') ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          (click)="page.togglePasswordVisibility('confirmPassword')"
        >
          <piqo-svg [attr.icon]="page.isPasswordVisible('confirmPassword') ? 'ojo-cerrado' : 'ojo'" size="18"></piqo-svg>
        </button>
      </div>
    </label>

    @if (page.errorMessage()) {
      <p class="error">{{ page.errorMessage() }}</p>
    }

    <button type="submit" class="piqo-primary cta" [disabled]="page.loading()">
      @if (page.loading()) {
        <app-spinner [size]="20"></app-spinner>
      } @else {
        Guardar
      }
    </button>
  </form>
</div>
