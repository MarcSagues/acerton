<div class="page">
  <div class="head-row">
    <button type="button" class="back-btn" aria-label="Volver" (click)="page.goBack()">
      <piqo-svg icon="atras" size="20"></piqo-svg>
    </button>
    <h1>Cambiar contraseña</h1>
  </div>

  <form [formGroup]="page.form" (ngSubmit)="page.submit()" class="form">
    <label class="field">
      <span class="field-label">Contraseña actual</span>
      <div class="field-input">
        <input
          [type]="page.passwordVisible() ? 'text' : 'password'"
          formControlName="currentPassword"
          autocomplete="current-password"
        />
      </div>
    </label>

    <label class="field">
      <span class="field-label">Contraseña nueva</span>
      <div class="field-input password-input">
        <input
          [type]="page.passwordVisible() ? 'text' : 'password'"
          formControlName="newPassword"
          autocomplete="new-password"
          placeholder="Minimo 8 caracteres"
        />
        <button type="button" class="ghost-link" (click)="page.togglePasswordVisibility()">
          {{ page.passwordVisible() ? 'ocultar' : 'ver' }}
        </button>
      </div>
    </label>

    <label class="field">
      <span class="field-label">Repite la contraseña nueva</span>
      <div class="field-input">
        <input [type]="page.passwordVisible() ? 'text' : 'password'" formControlName="confirmPassword" autocomplete="new-password" />
      </div>
    </label>

    @if (page.errorMessage()) {
      <p class="error">{{ page.errorMessage() }}</p>
    }

    <button type="submit" class="piqo-primary cta" [disabled]="page.loading()">
      @if (page.loading()) {
        <app-spinner [size]="20"></app-spinner>
      } @else {
        Guardar
      }
    </button>
  </form>
</div>
