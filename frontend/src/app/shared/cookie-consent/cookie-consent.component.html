@if (page.visible()) {
  <div class="banner">
    <p>
      Usamos cookies propias necesarias para tu sesión y, si lo aceptas, cookies de Google para
      mostrar anuncios. Más info en la
      <a routerLink="/privacy">política de privacidad</a>.
    </p>
    <div class="actions">
      <button class="btn ghost" (click)="page.reject()">Solo necesarias</button>
      <button class="btn primary" (click)="page.accept()">Aceptar</button>
    </div>
  </div>
}
