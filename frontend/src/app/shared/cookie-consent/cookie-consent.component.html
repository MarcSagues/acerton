@if (page.visible()) {
  <div class="banner">
    <p>
      {{ 'cookieConsent.usamosCookiesPropiasNecesarias' | t }}
      <a routerLink="/privacy">{{ 'common.politicaPrivacidad' | t }}</a>.
    </p>
    <div class="actions">
      <button class="btn ghost" (click)="page.reject()">{{ 'cookieConsent.soloNecesarias' | t }}</button>
      <button class="btn primary" (click)="page.accept()">{{ 'common.aceptar' | t }}</button>
    </div>
  </div>
}
