@if (visible()) {
  <div class="banner">
    <p>
      Usamos cookies propias necesarias para tu sesion y, si lo aceptas, cookies de Google para
      mostrar anuncios. Mas info en la
      <a routerLink="/privacy">politica de privacidad</a>.
    </p>
    <div class="actions">
      <button class="btn ghost" (click)="reject()">Solo necesarias</button>
      <button class="btn primary" (click)="accept()">Aceptar</button>
    </div>
  </div>
}
