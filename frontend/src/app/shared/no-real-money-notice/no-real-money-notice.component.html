@if (visible()) {
  <div class="overlay">
    <div class="dialog">
      <div class="icon">i</div>
      <h2>Sin dinero real</h2>
      <p>
        Acerton es un juego social <strong>gratuito</strong> para grupos de amigos. No se paga por
        participar, no hay apuestas ni loterias, y los puntos e insignias que consigues no tienen
        valor monetario ni son canjeables por premios en metalico o de ningun otro tipo.
      </p>
      <button class="btn" (click)="dismiss()">Entendido</button>
    </div>
  </div>
}
