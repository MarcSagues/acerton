<div class="confirm-dialog">
  <div class="title">{{ data.title }}</div>
  <div class="message">{{ data.message }}</div>
  <div class="actions">
    <button class="btn ghost" (click)="cancel()">{{ data.cancelLabel ?? ('common.cancelar' | t) }}</button>
    <button class="btn primary" (click)="confirm()">{{ data.confirmLabel ?? ('confirmDialog.confirmar' | t) }}</button>
  </div>
</div>
