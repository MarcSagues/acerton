<div class="sheet-handle"></div>
<div class="sheet-list" role="listbox" aria-label="Elegir grupo">
  @for (group of activeGroupService.groups(); track group.id) {
    <button
      type="button"
      role="option"
      class="row"
      [class.active]="group.id === activeGroupService.activeGroup()?.id"
      [attr.aria-selected]="group.id === activeGroupService.activeGroup()?.id"
      (click)="select(group.id)"
    >
      <span class="avatar">{{ initials(group.name) }}</span>
      <span class="meta">
        <span class="name">{{ group.name }}</span>
        <span class="sub">{{ group._count?.memberships ?? 0 }} miembros · {{ group.isPublic ? 'público' : 'privado' }}</span>
      </span>
      @if (group.id === activeGroupService.activeGroup()?.id) {
        <piqo-svg icon="check" size="18"></piqo-svg>
      }
    </button>
  }
</div>
