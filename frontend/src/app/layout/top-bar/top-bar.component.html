<div class="top-bar">
  <piqo-svg logo size="146"></piqo-svg>
  <div class="spacer"></div>
  <button type="button" class="icon-btn" [attr.aria-label]="page.unreadCount() > 0 ? 'Avisos, ' + page.unreadCount() + ' sin leer' : 'Avisos'" (click)="page.goNotifications()">
    <piqo-svg icon="campana" size="24"></piqo-svg>
    @if (page.unreadCount() > 0) {
      <span class="unread-badge mono">{{ page.unreadCount() > 9 ? '9+' : page.unreadCount() }}</span>
    }
  </button>
  <button type="button" class="avatar-btn" aria-label="Tu perfil" (click)="page.goProfile()">
    @if (page.currentUser(); as user) {
      <app-avatar [url]="user.avatarUrl" [background]="user.avatarBackground" [name]="user.name" [size]="36"></app-avatar>
    }
  </button>
</div>
