<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Piqo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0B0E10">

  <!--
    Aplica la preferencia de tema (Claro/Oscuro/Automatico, guardada por
    ThemeService) antes de que cargue nada mas, para no pintar primero un
    tema y luego cambiar a otro de golpe. "Automatico" = sin atributo,
    resuelto por prefers-color-scheme en styles.scss.
  -->
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('piqo-theme');
        if (pref === 'light' || pref === 'dark') {
          document.documentElement.setAttribute('data-theme', pref);
        }
      } catch (e) {}
    })();
  </script>

  <!--
    Loader estatico, sin depender de Angular ni de styles.css: pinta al
    instante (incluso mientras se descarga el bundle) y cubre tambien la
    espera de APP_INITIALIZER (auth.service.bootstrap()) si el backend de
    Render esta "dormido" y tarda varios segundos en responder. Angular
    sustituye el contenido de <app-root> en cuanto arranca de verdad, asi
    que esto solo se ve mientras no hay nada mas que mostrar.
  -->
  <style>
    /* Pantalla de marca: siempre oscura (grafito + champan), en los dos temas. */
    #boot-loader {
      position: fixed;
      inset: 0;
      background: #0b0e10;
      color: #f1f0ea;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      font-family: 'Inter', system-ui, sans-serif;
      z-index: 9999;
    }
    #boot-loader .boot-mark {
      width: 52px;
      height: 52px;
      border-radius: 17px;
      background: #d2be94;
      color: #121619;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 800 20px/1 'Manrope', sans-serif;
      letter-spacing: -2px;
    }
    #boot-loader .boot-track {
      width: 160px;
      height: 4px;
      border-radius: 2px;
      background: rgba(241, 240, 234, 0.12);
      overflow: hidden;
    }
    #boot-loader .boot-fill {
      height: 100%;
      width: 0%;
      border-radius: 2px;
      background: #d2be94;
      animation: boot-progress 40s cubic-bezier(0.15, 0.7, 0.3, 1) forwards;
    }
    #boot-loader .boot-label {
      font: 600 11px/1.4 'Inter', system-ui, sans-serif;
      color: rgba(241, 240, 234, 0.55);
      letter-spacing: 0.04em;
    }
    #boot-loader .boot-hint {
      font: 400 10px/1.5 'Inter', system-ui, sans-serif;
      color: rgba(241, 240, 234, 0.35);
      max-width: 220px;
      text-align: center;
      opacity: 0;
      animation: boot-hint-in 0.4s ease forwards;
      animation-delay: 4s;
    }
    @keyframes boot-progress {
      0% { width: 0%; }
      3% { width: 35%; }
      12% { width: 55%; }
      30% { width: 70%; }
      60% { width: 84%; }
      100% { width: 93%; }
    }
    @keyframes boot-hint-in {
      to { opacity: 1; }
    }
    #boot-loader.boot-done .boot-fill {
      animation: none;
      width: 100%;
      transition: width 0.25s ease;
    }
    #boot-loader.boot-done {
      opacity: 0;
      transition: opacity 0.3s ease 0.2s;
    }
  </style>

  <!--
    Google Consent Mode: por defecto todo denegado hasta que el usuario
    acepte en el banner de cookies (app-cookie-consent). Debe declararse
    ANTES de cargar adsbygoogle.js para que arranque ya en modo restringido.
  -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('consent', 'default', {
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      analytics_storage: 'denied',
    });
  </script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1185144357301303" crossorigin="anonymous"></script>
</head>
<body class="mat-typography">
  <app-root>
    <div id="boot-loader">
      <div class="boot-mark">pq</div>
      <div class="boot-track"><div class="boot-fill"></div></div>
      <div class="boot-label">CARGANDO</div>
      <div class="boot-hint">El servidor puede tardar unos segundos en despertar</div>
    </div>
  </app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
