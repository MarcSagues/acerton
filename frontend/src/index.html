<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Quiniela</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0E1114">

  <!--
    Loader estatico, sin depender de Angular ni de styles.css: pinta al
    instante (incluso mientras se descarga el bundle) y cubre tambien la
    espera de APP_INITIALIZER (auth.service.bootstrap()) si el backend de
    Render esta "dormido" y tarda varios segundos en responder. Angular
    sustituye el contenido de <app-root> en cuanto arranca de verdad, asi
    que esto solo se ve mientras no hay nada mas que mostrar.
  -->
  <style>
    #boot-loader {
      position: fixed;
      inset: 0;
      background: #0e1114;
      color: #f2f4f3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      z-index: 9999;
    }
    #boot-loader .boot-mark {
      width: 52px;
      height: 52px;
      border-radius: 15px;
      background: #12b76a;
      color: #0e1114;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 700 18px/1 'JetBrains Mono', ui-monospace, monospace;
    }
    #boot-loader .boot-track {
      width: 160px;
      height: 4px;
      border-radius: 2px;
      background: #1e242b;
      overflow: hidden;
    }
    #boot-loader .boot-fill {
      height: 100%;
      width: 0%;
      border-radius: 2px;
      background: #12b76a;
      animation: boot-progress 40s cubic-bezier(0.15, 0.7, 0.3, 1) forwards;
    }
    #boot-loader .boot-label {
      font: 400 11px/1.4 'JetBrains Mono', ui-monospace, monospace;
      color: #8c949b;
      letter-spacing: 0.04em;
    }
    #boot-loader .boot-hint {
      font: 400 10px/1.5 'Space Grotesk', system-ui, sans-serif;
      color: #5e666d;
      max-width: 220px;
      text-align: center;
      opacity: 0;
      animation: boot-hint-in 0.4s ease forwards;
      animation-delay: 4s;
    }
    @keyframes boot-progress {
      0% { width: 0%; }
      3% { width: 35%; }
      12% { width: 55%; }
      30% { width: 70%; }
      60% { width: 84%; }
      100% { width: 93%; }
    }
    @keyframes boot-hint-in {
      to { opacity: 1; }
    }
    #boot-loader.boot-done .boot-fill {
      animation: none;
      width: 100%;
      transition: width 0.25s ease;
    }
    #boot-loader.boot-done {
      opacity: 0;
      transition: opacity 0.3s ease 0.2s;
    }
  </style>

  <!--
    Google Consent Mode: por defecto todo denegado hasta que el usuario
    acepte en el banner de cookies (app-cookie-consent). Debe declararse
    ANTES de cargar adsbygoogle.js para que arranque ya en modo restringido.
  -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('consent', 'default', {
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      analytics_storage: 'denied',
    });
  </script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1185144357301303" crossorigin="anonymous"></script>
</head>
<body class="mat-typography">
  <app-root>
    <div id="boot-loader">
      <div class="boot-mark">1X2</div>
      <div class="boot-track"><div class="boot-fill"></div></div>
      <div class="boot-label">CARGANDO</div>
      <div class="boot-hint">El servidor puede tardar unos segundos en despertar</div>
    </div>
  </app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
