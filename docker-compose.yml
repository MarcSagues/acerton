services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: acerton
    ports:
      - "5433:5432"
    volumes:
      - acerton_postgres_data:/var/lib/postgresql/data

volumes:
  acerton_postgres_data:
