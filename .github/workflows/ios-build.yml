name: iOS Build

# Manual only: un runner macOS consume minutos de Actions mucho mas rapido
# que uno Linux, asi que esto no corre en cada push, solo cuando se lanza
# a mano desde la pestana "Actions" de GitHub.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'A que API apunta el build (dev usa dev.acerton.app/api-dev, pensado para probar en TestFlight sin tocar produccion)'
        required: true
        type: choice
        options:
          - production
          - dev
        default: production

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Capacitor 8 (distribuido por SPM) requiere Xcode 26 / Swift 6.2: con
      # una version mas antigua, una parte de su API queda oculta tras un
      # feature flag experimental y los plugins oficiales no compilan
      # (ver https://github.com/ionic-team/capacitor/issues/8333).
      - name: Seleccionar Xcode 26
        run: |
          # El nombre exacto de la app varia segun la imagen del runner
          # (Xcode_26.6.app, Xcode_26.6.0.app, etc.) - se coge la version 26.x
          # mas alta disponible en vez de fijar un numero de parche concreto.
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Usando $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          else
            echo "Xcode 26 no encontrado en este runner. Versiones disponibles:"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias y compilar el frontend
        working-directory: frontend
        run: |
          npm ci
          if [ "${{ inputs.environment }}" = "dev" ]; then
            npm run build:dev
          else
            npm run build
          fi

      - name: Sincronizar Capacitor (iOS)
        working-directory: frontend
        run: npx cap sync ios

      # Para que un build de dev no se confunda con el de produccion en el
      # dispositivo (TestFlight/pantalla de inicio) una vez instalado. El
      # client id que usa Google Sign-In (environment.googleWebClientId) se
      # deja igual en todos los environment.*.ts: es el mismo en todos los
      # builds nativos (ver auth.service.ts frontend/backend), el backend de
      # dev es el que aprende a aceptarlo via GOOGLE_NATIVE_CLIENT_ID.
      - name: Renombrar la app para el build de dev
        if: inputs.environment == 'dev'
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Quiniela (dev)" \
            frontend/ios/App/App/Info.plist

      # Certificado de distribucion + perfil de aprovisionamiento, ambos
      # guardados como secretos del repo (nunca en el codigo). Se importan
      # a un llavero temporal que se borra al final del job.
      - name: Instalar certificado y perfil de aprovisionamiento
        env:
          IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          echo "$IOS_DIST_CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$IOS_DIST_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/cert.p12"

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_DIR/quiniela.mobileprovision"

      - name: Archivar (xcodebuild archive)
        working-directory: frontend/ios/App
        run: |
          # La firma manual (equipo/identidad/perfil) vive en la config Release
          # del target App dentro del propio project.pbxproj, no aqui: pasarla
          # por linea de comandos se aplica a TODOS los targets del build,
          # incluidos los paquetes SPM de terceros (Google Sign-In, etc.), que
          # no admiten perfil de aprovisionamiento y hacen fallar el archivado.
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination "generic/platform=iOS" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      # Clave de API de App Store Connect (rol "App Manager"), usada por
      # xcodebuild para autenticar la subida a TestFlight sin Xcode/Transporter.
      - name: Preparar clave de App Store Connect
        env:
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          echo "$APPSTORE_API_KEY_BASE64" | base64 --decode -o "$RUNNER_TEMP/AuthKey.p8"

      - name: Exportar .ipa y subir a TestFlight
        working-directory: frontend/ios/App
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.acerton.quiniela</key>
              <string>Sagui</string>
            </dict>
            <key>destination</key>
            <string>upload</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID ${{ secrets.APPSTORE_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_API_ISSUER_ID }}
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Subir el .ipa como artefacto de este workflow
        uses: actions/upload-artifact@v4
        with:
          name: Quiniela-ios-${{ inputs.environment }}-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

      # ntfy.sh: gratis, sin registro. El topic actua como "contraseña" del
      # canal — no es privado de verdad (cualquiera que lo adivine puede
      # suscribirse), pero al ser aleatorio es suficiente para un aviso
      # personal sin datos sensibles.
      - name: Avisar por movil (ntfy.sh)
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="iOS Build #${{ github.run_number }} (${{ inputs.environment }}) completado"
            TAGS="white_check_mark"
            PRIORITY="default"
          else
            TITLE="iOS Build #${{ github.run_number }} (${{ inputs.environment }}) fallo"
            TAGS="x"
            PRIORITY="high"
          fi
          curl -s \
            -H "Title: $TITLE" \
            -H "Priority: $PRIORITY" \
            -H "Tags: $TAGS" \
            -d "Estado: ${{ job.status }} - https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            https://ntfy.sh/acerton-ios-4bf21f2b
